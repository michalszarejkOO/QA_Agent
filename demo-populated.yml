    value: "UZdWK-m12GWyrDThTfDhoxEADV1VSw5y_Tz4Ekh2R0s"
    description: "For auth/refresh-token/02-reuse-revokes-whole-chain.yml. Genuinely stale: captured as the refresh_token cookie from freshMobileNumber's verify-otp response, then made stale by one /auth/refresh rotation (2026-09-21 11:20 UTC). A rotated-away token stays invalid forever, so this value does not need refreshing."
  - name: expiredRefreshToken
    value: ""
    description: "For auth/refresh-token/03-expired-token.yml. Left blank deliberately - a genuinely expired token can only be produced by waiting out the real 28-day TTL (or direct DB manipulation), not by a live API call. See that file's docs for manual steps."
