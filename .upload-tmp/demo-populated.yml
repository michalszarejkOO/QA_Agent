    value: https://api.mowaamah.demo.devops.takamol.support/mowaamah-application-api
    description: ""
  - name: testMobileNumber
    value: "+966500000000"
    description: "Reusable god-code number with an existing completed 'pwd' account. Safe to reuse across happy-path OTP runs; do not use for auth/role-mismatch (reserves +966500000501) or auth/access-control (reserves its own numbers)."
  - name: freshMobileNumber
    value: "+966586391465"
    description: "Number used to mint an 'incomplete'-status account (request-otp + verify-otp, no register). Minted 2026-10-09 07:21 UTC. If a fresh incomplete token is needed again, use a new, never-before-used number instead of reusing this one."
  - name: godOtpCode
    value: "999999"
    description: "GOD_OTP - works for any mobile number when the backend runs with SMS_MOCK=true (confirmed true on demo as of 2026-10-01)."
